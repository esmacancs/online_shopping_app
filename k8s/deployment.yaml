apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop
  labels:
    app: online-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
        - name: online-shop
          # Image built and pushed by the GitHub Actions workflow to GHCR.
          # Replace "esmacancs/online_shopping_app" with your <owner>/<repo>.
          # Pin to an immutable SHA tag for production, e.g.:
          #   ghcr.io/esmacancs/online_shopping_app:sha-<commit-sha>
          image: ghcr.io/esmacancs/sarma/online_shop:v1
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
